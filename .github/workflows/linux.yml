name: Linux

# Triggers: a version tag always publishes, and a push to a development branch
# always checks — neither is filtered by paths, because a tag can point at a
# commit whose diff is only documentation while the tree it names is the whole
# release (that is exactly how the first v2.1.0 tag managed to publish nothing).
# Pull requests are filtered: ten minutes of CI on a README typo helps nobody.
on:
  push:
    branches:
      - main
      - rust-gui
    tags:
      - "v[0-9]*"
  pull_request:
    paths:
      - "dsmon-core/**"
      - "dsmon-ui/**"
      - "assets/**"
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/linux.yml"
  workflow_dispatch:

jobs:
  build:
    # Both architectures this version ships for, each built on a runner of that
    # architecture: the packages are made from a binary built on the same kind
    # of machine they will run on.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Debian 12 carries glibc 2.36, which is the oldest this version supports
    # (Debian 12, Ubuntu 24.04, Fedora 38 and later). Building here is what
    # keeps newer symbols out of the binary, so no separate check is needed.
    container: debian:12
    permissions:
      contents: write

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl file gcc g++ libc6-dev make pkg-config \
            imagemagick rpm

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --workspace --locked

      # Both binaries: the packaging step builds a package per binary, and the
      # widget's is only made when its executable is there to pack.
      - name: Build release binaries
        run: cargo build --release --locked -p dsmon-ui --bin dsmon2 --bin dsmon2-widget

      - name: Report the glibc floor
        run: |
          for binary in target/release/dsmon2 target/release/dsmon2-widget; do
            file "$binary"
            echo -n "highest glibc symbol in $binary: "
            objdump -T "$binary" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1
          done

      # The container runs `sh`, and the version is a line of the workspace
      # manifest either way, so neither bash nor an interpreter is needed.
      - name: Resolve the version
        id: version
        run: |
          case "${GITHUB_REF_NAME}" in
            v*) version="${GITHUB_REF_NAME#v}" ;;
            *) version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" ;;
          esac
          if [ -z "$version" ]; then
            echo "the version could not be read" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "version: $version"

      # One package per program: the application, and the desktop widget beside
      # it. The script finds the second binary by the first one's directory.
      - name: Build packages
        run: |
          packaging/build-packages.sh "${{ steps.version.outputs.value }}" \
            "${{ matrix.arch }}" target/release/dsmon2 dist
          cd dist
          sha256sum ./*.deb ./*.rpm > "checksums-${{ matrix.arch }}.txt"
          cat "checksums-${{ matrix.arch }}.txt"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-balance-monitor-linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/checksums-*.txt

  # One release, not one per build: the jobs wait for every architecture, and
  # the group keeps the two workflows from creating the same release at once.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect the packages
        uses: actions/download-artifact@v4
        with:
          pattern: deepseek-balance-monitor-linux-*
          merge-multiple: true
          path: packages

      - name: List them
        run: ls -l packages

      # The download table is written here and nowhere else: the Windows
      # workflow leaves the body alone, so the release reads the same whichever
      # of the two finishes first. It is written rather than appended, so
      # re-running this job for a tag — which is what a failed publish needs —
      # replaces the table instead of adding a second copy of it.
      #
      # The links carry the tag, which is what makes every version's record
      # download the files of that version: a `latest` link would have to be the
      # file's exact name, and those carry the version too.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.deb
            packages/*.rpm
            packages/checksums-*.txt
          body: |
            ## 下载

            主程序与桌面小工具**各是一个包**：可以只装主程序，也可以两个都装、分别升级。
            每个架构另附 `checksums-*.txt`，可核对 SHA256。本版改了什么见
            [CHANGELOG](https://github.com/wenyinos/DeepSeekBalanceMonitor/blob/main/docs/CHANGELOG_zh.md)。

            **Linux**（Debian / Ubuntu 用 `.deb`，Fedora 系用 `.rpm`）

            | 架构 | 主程序 | 桌面小工具 |
            |---|---|---|
            | amd64 / x86-64 | [.deb](https://github.com/wenyinos/DeepSeekBalanceMonitor/releases/download/${{ github.ref_name }}/deepseek-balance-monitor_${{ steps.version.outputs.value }}_amd64.deb) · [.rpm](https://github.com/wenyinos/DeepSeekBalanceMonitor/releases/download/${{ github.ref_name }}/deepseek-balance-monitor-${{ steps.version.outputs.value }}-1.x86_64.rpm) | [.deb](https://github.com/wenyinos/DeepSeekBalanceMonitor/releases/download/${{ github.ref_name }}/deepseek-balance-monitor-widget_${{ steps.version.outputs.value }}_amd64.deb) · [.rpm](https://github.com/wenyinos/DeepSeekBalanceMonitor/releases/download/${{ github.ref_name }}/deepseek-balance-monitor-widget-${{ steps.version.outputs.value }}-1.x86_64.rpm) |
            | arm64 / aarch64 | [.deb](https://github.com/wenyinos/DeepSeekBalanceMonitor/releases/download/${{ github.ref_name }}/deepseek-balance-monitor_${{ steps.version.outputs.value }}_arm64.deb) · [.rpm](https://github.com/wenyinos/DeepSeekBalanceMonitor/releases/download/${{ github.ref_name }}/deepseek-balance-monitor-${{ steps.version.outputs.value }}-1.aarch64.rpm) | [.deb](https://github.com/wenyinos/DeepSeekBalanceMonitor/releases/download/${{ github.ref_name }}/deepseek-balance-monitor-widget_${{ steps.version.outputs.value }}_arm64.deb) · [.rpm](https://github.com/wenyinos/DeepSeekBalanceMonitor/releases/download/${{ github.ref_name }}/deepseek-balance-monitor-widget-${{ steps.version.outputs.value }}-1.aarch64.rpm) |

            **Windows**（MSI 安装包）

            | 架构 | 主程序 | 桌面小工具 |
            |---|---|---|
            | x64 | [.msi](https://github.com/wenyinos/DeepSeekBalanceMonitor/releases/download/${{ github.ref_name }}/deepseek-balance-monitor-${{ steps.version.outputs.value }}-windows-x64.msi) | [.msi](https://github.com/wenyinos/DeepSeekBalanceMonitor/releases/download/${{ github.ref_name }}/deepseek-balance-monitor-widget-${{ steps.version.outputs.value }}-windows-x64.msi) |
            | arm64 | [.msi](https://github.com/wenyinos/DeepSeekBalanceMonitor/releases/download/${{ github.ref_name }}/deepseek-balance-monitor-${{ steps.version.outputs.value }}-windows-arm64.msi) | [.msi](https://github.com/wenyinos/DeepSeekBalanceMonitor/releases/download/${{ github.ref_name }}/deepseek-balance-monitor-widget-${{ steps.version.outputs.value }}-windows-arm64.msi) |

            小工具装好后由托盘菜单「显示/隐藏桌面小工具」开关，也可以从开始菜单直接打开。
          overwrite_files: true
