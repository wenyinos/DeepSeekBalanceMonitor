name: Windows

# The same trigger as the Linux build: a version tag publishes, anything else
# only checks.
on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*"
    paths:
      - "dsmon-core/**"
      - "dsmon-ui/**"
      - "rust-windows/**"
      - "assets/**"
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "dsmon-core/**"
      - "dsmon-ui/**"
      - "rust-windows/**"
      - "assets/**"
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORG_ID: ${{ vars.SIGNPATH_ORG_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNING_CONFIGURED: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORG_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup target add ${{ matrix.target }}

      - name: Check formatting
        run: cargo fmt --all --check

      # The same code on either architecture: running the suite twice would
      # only take twice as long.
      - name: Run tests
        if: matrix.arch == 'x64'
        run: cargo test --workspace --locked

      - name: Build release executable
        run: cargo build --release --locked --target ${{ matrix.target }} -p dsmon-ui --bin deepseek-balance-monitor

      - name: Resolve the version
        id: version
        shell: pwsh
        run: |
          if ("${env:GITHUB_REF_NAME}" -like "v*") {
            $version = "${env:GITHUB_REF_NAME}".Substring(1)
          } else {
            $version = (cargo metadata --no-deps --format-version 1 |
              ConvertFrom-Json).packages[0].version
          }
          "asset=deepseek-balance-monitor-$version-windows-${{ matrix.arch }}" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version: $version"

      - name: Name the executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/dsmon2.exe" `
            "build/${{ steps.version.outputs.asset }}.exe"

      # The executable is signed before it goes into the installer, so the copy
      # that ends up in Program Files carries a signature of its own.
      - name: Upload the executable for signing
        id: upload-exe
        if: env.SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe-${{ matrix.arch }}
          path: build/*.exe

      - name: Sign the executable
        id: sign-exe
        if: env.SIGNING_CONFIGURED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORG_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: 'release'
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe

      - name: Install WiX
        run: |
          dotnet tool install --global wix
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build the installer
        shell: pwsh
        run: |
          $exe = "build/${{ steps.version.outputs.asset }}.exe"
          if (Test-Path "signed-exe") {
            $signed = Get-ChildItem "signed-exe" -Filter "*.exe" -File -Recurse | Select-Object -First 1
            if ($signed) {
              Copy-Item $signed.FullName $exe -Force
              Write-Host "the installer wraps the signed executable"
            }
          } else {
            Write-Host "signing is not configured; the installer wraps the unsigned executable"
          }

          wix build packaging/windows/product.wxs `
            -arch ${{ matrix.arch }} `
            -d Version=${{ steps.version.outputs.value }} `
            -d ExePath=$exe `
            -o "build/${{ steps.version.outputs.asset }}.msi"

      - name: Upload the installer for signing
        id: upload-msi
        if: env.SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-msi-${{ matrix.arch }}
          path: build/*.msi

      - name: Sign the installer
        id: sign-msi
        if: env.SIGNING_CONFIGURED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORG_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: 'release'
          github-artifact-id: ${{ steps.upload-msi.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-msi

      - name: Use the signed installer
        shell: pwsh
        run: |
          $msi = "build/${{ steps.version.outputs.asset }}.msi"
          if (Test-Path "signed-msi") {
            $signed = Get-ChildItem "signed-msi" -Filter "*.msi" -File -Recurse | Select-Object -First 1
            if ($signed) {
              Copy-Item $signed.FullName $msi -Force
              Write-Host "using the signed installer"
            }
          }

      - name: Write the checksum
        shell: pwsh
        run: |
          $asset = "${{ steps.version.outputs.asset }}.msi"
          "$((Get-FileHash "build/$asset" -Algorithm SHA256).Hash)  $asset" |
            Out-File "build/checksums-${{ matrix.arch }}.txt" -Encoding ascii
          Get-Content "build/checksums-${{ matrix.arch }}.txt"

      # The installer is the deliverable; the executable is only ever wrapped.
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-balance-monitor-windows-${{ matrix.arch }}
          path: |
            build/*.msi
            build/checksums-${{ matrix.arch }}.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.msi
            build/checksums-${{ matrix.arch }}.txt
          generate_release_notes: true
          overwrite_files: true
